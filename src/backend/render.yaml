services:
  # Backend API Service - Local Content Mode
  - type: web
    name: course-companion-api
    env: python
    region: oregon
    plan: free
    rootDir: src/backend
    buildCommand: pip install -r requirements-local.txt
    startCommand: uvicorn local_main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_ENV
        value: production
      - key: CONTENT_DIR
        value: /opt/render/project/src/src/backend/sample-content
